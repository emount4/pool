name: pool
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pool_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pool_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./database/migrations/002_no_overlaps.sql:/docker-entrypoint-initdb.d/03-no-overlaps.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pool_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pool_postgres_data:
